name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Verify local installer
        run: |
          install_root="$(mktemp -d)"
          trap 'rm -r "$install_root"' EXIT
          ./scripts/install.sh --skip-build --bin-dir "$install_root/bin"
          "$install_root/bin/alfacode" --help
          ./scripts/uninstall.sh --bin-dir "$install_root/bin"
          test ! -e "$install_root/bin/alfacode"
