name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Verify local installer
        run: |
          install_root="$(mktemp -d)"
          trap 'rm -r "$install_root"' EXIT
          ./scripts/install.sh --skip-build --bin-dir "$install_root/bin"
          "$install_root/bin/alfacode" --help
          ./scripts/uninstall.sh --bin-dir "$install_root/bin"
          test ! -e "$install_root/bin/alfacode"
